[workspace]
changelog_update = true
git_release_enable = true
git_tag_enable = true
publish = true
# Catch accidental API breakage before it reaches crates.io.
semver_check = true
# Pre-1.0: a breaking change bumps the minor, not the major.
allow_dirty = false

# `neovision` re-exports `neovision-core` wholesale, so a change to either is a
# change to both from a user's point of view. Sharing a version group keeps
# them on one number and releases them together.
[[package]]
name = "neovision-core"
version_group = "neovision"

[[package]]
name = "neovision"
version_group = "neovision"

[changelog]
protect_breaking_commits = true
header = """
# Changelog

All notable changes are recorded here. This file is generated from
conventional commits by [git-cliff](https://git-cliff.org) via
[release-plz](https://release-plz.dev).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^build", group = "Build System" },
  { message = "^ci", group = "CI" },
  { message = "^revert", group = "Reverts" },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
]
