[package]
name = "neovision-core"
description = "Character-cell graphics substrate: a VGA-layout cell buffer, layers, a compositor, and CP437 box drawing. no_std, zero dependencies."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = []
# The bundled IBM VGA 8x16 face. Off by default: only hosts that rasterize
# pixels need it, and 4 KiB of glyph data is not free on the bare-metal targets
# a no_std crate is expected to reach.
font = []

[package.metadata.docs.rs]
all-features = true
