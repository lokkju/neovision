name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Publishes to crates.io and cuts a GitHub release once a release PR lands.
  #
  # Authentication is crates.io trusted publishing: GitHub's OIDC token is
  # exchanged for a short-lived crates.io token, which the auth action revokes
  # when the job ends. No long-lived publishing secret is stored in this repo.
  #
  # A trusted publisher can only be registered against a crate that already
  # exists, so the very first release of each crate is published by hand. This
  # job stays red until that has happened and both publishers are registered.
  release:
    name: Release
    runs-on: ubuntu-latest
    # Narrows the OIDC claim: crates.io only honours a token minted by a run
    # in this environment, on top of pinning the workflow filename. The
    # environment is restricted to `main` by GitHub itself, so the rule
    # survives any later widening of this workflow's triggers.
    #
    # Deliberately no required reviewers. This job runs on every push to main
    # and is a no-op unless there is something to release, so an approval gate
    # would prompt on unrelated merges and train the reviewer to click through.
    # The real human gate is merging the release PR.
    environment: release
    permissions:
      contents: write
      # Required to request the OIDC token. Without it the exchange fails.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Exchange the OIDC token for a crates.io token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Opens or refreshes the release PR: version bumps plus changelog entries.
  # Touches only git, never the registry, so it needs no crates.io credential.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
