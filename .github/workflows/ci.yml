name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --all-targets
      # --all-targets skips doctests, so they get their own run.
      - run: cargo test --workspace --all-features --doc
      # The framebuffer host writes a real frame with no display attached,
      # which keeps the rasterizer covered here rather than only by eye.
      - run: cargo run --example framebuffer -- --single /tmp/frame.ppm
      # 80x25 cells at 8x16 px, 3 bytes a pixel, plus the PPM header.
      # The GIF the README shows is generated by the same renderer, so a break
      # in it should fail here rather than surface as a broken image.
      - run: cargo run --example framebuffer -- --gif /tmp/demo.gif
      - name: Check the rendered frame is the expected size
        run: |
          size=$(stat -c%s /tmp/frame.ppm)
          expected=$((640 * 400 * 3))
          if [ "$size" -lt "$expected" ]; then
            echo "frame.ppm is $size bytes, expected at least $expected"
            exit 1
          fi

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.76.0
      - uses: Swatinem/rust-cache@v2
      # Libraries only. The demo depends on crossterm, whose MSRV is its own
      # concern and must not constrain what the published crates support.
      - run: cargo check -p neovision-core -p neovision --lib

  no_std:
    name: Build for a no_std target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # The point of the crates is that they need no operating system. A bare
      # target with no `std` proves it, in a way a host build never can.
      - run: cargo build -p neovision-core -p neovision --target thumbv7em-none-eabihf
      # The bundled font is const data and must not drag in std either.
      - run: cargo build -p neovision-core --target thumbv7em-none-eabihf --features font
