[package]
name = "neovision"
description = "A CUA / Turbo-Vision-style modal-form widget toolkit for character-cell text UIs. Renderer-agnostic and no_std; emits cell buffers a host rasterizes anywhere."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib"]

[features]
# On by default here, off by default in neovision-core. This crate is the
# batteries-included one — `cargo add neovision` should just be able to draw —
# while the substrate stays minimal for anyone counting bytes. A build that
# genuinely cannot spare the 4 KiB takes `default-features = false`, or depends
# on neovision-core directly.
default = ["font"]
# Re-exports the bundled VGA face from neovision-core, for pixel hosts.
font = ["neovision-core/font"]

[dependencies]
neovision-core = { workspace = true }

[dev-dependencies]
crossterm = "0.28"
minifb = "0.28"
# Everything but `color_quant`, which is a default we deliberately skip: the
# framebuffer host already produces palette indices, so there is nothing to
# quantize. `std` and `raii_no_panic` are the other two defaults and are needed.
gif = { version = "0.14", default-features = false, features = ["std", "raii_no_panic"] }
# The de-facto display abstraction for embedded Rust. no_std itself, so the
# integration in examples/embedded.rs is the code a real device would ship.
embedded-graphics = "0.8"
# Only for `--card`, which writes the repository's social preview image. PNG is
# the format GitHub's uploader documents, and an indexed PNG keeps the same
# no-quantization property the GIF has: the palette goes out as the palette.
png = { version = "0.17", default-features = false }

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "terminal"
path = "examples/terminal.rs"

[[example]]
name = "embedded"
path = "examples/embedded.rs"
required-features = ["font"]

[[example]]
name = "framebuffer"
path = "examples/framebuffer.rs"
# Satisfied by the default feature set, so this documents the dependency
# without making anyone pass a flag to run it.
required-features = ["font"]
